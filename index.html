<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>学習ポータル</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Segoe UI",
        sans-serif;

      background: #6a768b;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input {
      font: inherit;
    }

    /* ログイン画面 */

    #loginScreen {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    .portal {
      width: min(960px, 100%);
      min-height: 500px;

      display: flex;
      overflow: hidden;

      background: #ffffff;
      border-radius: 16px;

      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.24);
    }

    .portalIntro {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 48px;

      color: #ffffff;
      text-align: center;
      background: #a5adba;
    }

    .portalIntro h1 {
      margin: 0 0 26px;

      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      letter-spacing: 0.18em;
    }

    .portalIntro p {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.9;
    }

    .loginPanel {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 52px;
      background: #ffffff;
    }

    .logo {
      margin-bottom: 42px;

      color: #52647d;
      font-size: 2rem;
      font-weight: 700;
    }

    label {
      margin-bottom: 10px;
      color: #687386;
      font-size: 0.95rem;
    }

    #password {
      width: 100%;
      min-height: 50px;

      padding: 12px 4px;

      color: #243044;
      background: transparent;

      border: 0;
      border-bottom: 2px solid #d6dbe4;
      border-radius: 0;

      font-size: 16px;
      outline: none;

      -webkit-appearance: none;
      appearance: none;
    }

    #password:focus {
      border-bottom-color: #6685f5;
    }

    #loginButton {
      width: 100%;
      min-height: 52px;

      margin-top: 30px;
      padding: 14px 20px;

      color: #ffffff;
      background: #6e89f5;

      border: 0;
      border-radius: 999px;

      cursor: pointer;
      touch-action: manipulation;

      -webkit-appearance: none;
      appearance: none;
    }

    #loginButton:active {
      background: #5876eb;
      transform: scale(0.99);
    }

    #error {
      display: none;
      margin-top: 16px;
      color: #c93535;
      font-size: 0.95rem;
    }

    /* 時計画面 */

    #clockScreen {
      display: none;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 22px;

      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));

      overflow: hidden;
      background: #000000;
    }

    #clock {
      color: #00ff00;

      font-family:
        ui-monospace,
        "SFMono-Regular",
        Menlo,
        Monaco,
        monospace;

      font-size: clamp(4rem, 12vw, 10rem);
      line-height: 1;

      text-align: center;
      white-space: nowrap;

      text-shadow:
        0 0 10px #00ff00,
        0 0 22px #00ff00,
        0 0 44px rgba(0, 255, 0, 0.7);
    }

    #currentUrl {
      width: min(900px, 92vw);

      color: #00eaff;

      font-family:
        ui-monospace,
        "SFMono-Regular",
        Menlo,
        Monaco,
        monospace;

      font-size: clamp(0.72rem, 1.8vw, 1rem);
      line-height: 1.5;

      text-align: center;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* デバッグ表示 */

    #debugPanel {
      width: min(720px, 92vw);

      padding: 14px 16px;

      color: #dce7ed;
      background: rgba(20, 29, 34, 0.92);

      border: 1px solid #33444d;
      border-radius: 10px;

      font-family:
        ui-monospace,
        "SFMono-Regular",
        Menlo,
        Monaco,
        monospace;

      font-size: clamp(0.72rem, 1.7vw, 0.92rem);
      line-height: 1.6;

      overflow-wrap: anywhere;
    }

    .debugRow {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
    }

    .debugLabel {
      color: #91a5af;
    }

    #statusValue.success {
      color: #5cff81;
    }

    #statusValue.error {
      color: #ff6b6b;
    }

    #testButton {
      min-height: 44px;

      padding: 10px 22px;

      color: #ffffff;
      background: #344d59;

      border: 1px solid #52707d;
      border-radius: 999px;

      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;

      -webkit-appearance: none;
      appearance: none;
    }

    #testButton:active {
      background: #456470;
    }

    /* iPad縦向き・狭い画面 */

    @media (max-width: 720px) {
      .portal {
        min-height: auto;
        flex-direction: column;
      }

      .portalIntro {
        padding: 34px 24px;
      }

      .portalIntro h1 {
        margin-bottom: 14px;
      }

      .loginPanel {
        padding: 34px 26px;
      }

      .logo {
        margin-bottom: 28px;
      }
    }
  </style>
</head>

<body>
  <main id="loginScreen">
    <section class="portal">
      <div class="portalIntro">
        <h1>LEARNING</h1>

        <p>
          学習ポータルシステム<br>
          学校から配布された<br>
          アクセスコードを入力してください
        </p>
      </div>

      <div class="loginPanel">
        <div class="logo">📘 学習ポータル</div>

        <label for="password">アクセスコード</label>

        <input
          id="password"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          placeholder="コードを入力"
        >

        <button id="loginButton" type="button">
          学習開始
        </button>

        <div id="error" role="alert">
          アクセスコードが違います
        </div>
      </div>
    </section>
  </main>

  <main id="clockScreen">
    <div id="clock">00:00:00</div>

    <div id="currentUrl">URLを確認しています...</div>

    <section id="debugPanel" aria-live="polite">
      <div class="debugRow">
        <span class="debugLabel">状態</span>
        <span id="statusValue">待機中</span>
      </div>

      <div class="debugRow">
        <span class="debugLabel">実行回数</span>
        <span id="countValue">0</span>
      </div>

      <div class="debugRow">
        <span class="debugLabel">最終実行</span>
        <span id="lastRunValue">未実行</span>
      </div>

      <div class="debugRow">
        <span class="debugLabel">URL変更</span>
        <span id="urlChangedValue">未確認</span>
      </div>

      <div class="debugRow">
        <span class="debugLabel">エラー</span>
        <span id="errorValue">なし</span>
      </div>
    </section>

    <button id="testButton" type="button">
      URL変更を1回テスト
    </button>
  </main>

  <script>
    "use strict";

    const PASSWORD = "0423";

    const titles = [
      "学習ポータル",
      "学習記録",
      "提出課題",
      "教材閲覧",
      "確認テスト",
      "学習管理",
      "授業メモ",
      "自主学習",
      "課題一覧"
    ];

    const subjects = [
      "math",
      "english",
      "science",
      "social",
      "japanese"
    ];

    let clockTimer = null;
    let titleTimer = null;
    let changeCount = 0;
    let systemStarted = false;

    const loginScreen = document.getElementById("loginScreen");
    const clockScreen = document.getElementById("clockScreen");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("error");

    const clockElement = document.getElementById("clock");
    const currentUrlElement = document.getElementById("currentUrl");

    const statusValue = document.getElementById("statusValue");
    const countValue = document.getElementById("countValue");
    const lastRunValue = document.getElementById("lastRunValue");
    const urlChangedValue = document.getElementById("urlChangedValue");
    const errorValue = document.getElementById("errorValue");

    const testButton = document.getElementById("testButton");

    function login() {
      const inputValue = passwordInput.value;

      if (inputValue !== PASSWORD) {
        loginError.style.display = "block";
        passwordInput.focus();
        return;
      }

      loginError.style.display = "none";
      loginScreen.style.display = "none";
      clockScreen.style.display = "flex";

      startSystem();
    }

    function startSystem() {
      if (systemStarted) {
        return;
      }

      systemStarted = true;

      updateClock();
      updateUrlDisplay();
      updateTitle();

      statusValue.textContent = "起動済み";
      statusValue.className = "success";

      clockTimer = window.setInterval(updateClock, 1000);
      titleTimer = window.setInterval(updateTitle, 5000);

      /*
        Safariの動作確認のため、起動時にURL変更を1回だけ実行します。
        以降は「URL変更を1回テスト」ボタンで確認できます。
      */
      testUrlChange();
    }

    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

      clockElement.textContent =
        `${hours}:${minutes}:${seconds}`;
    }

    function updateTitle() {
      const randomIndex =
        Math.floor(Math.random() * titles.length);

      document.title = titles[randomIndex];
    }

    function createTestUrl() {
      const randomIndex =
        Math.floor(Math.random() * subjects.length);

      const subject = subjects[randomIndex];
      const time = Date.now().toString(36);

      const random =
        Math.random()
          .toString(36)
          .slice(2, 10);

      return (
        `${location.pathname}` +
        `?s=${encodeURIComponent(subject)}` +
        `&t=${encodeURIComponent(time)}` +
        `&r=${encodeURIComponent(random)}`
      );
    }

    function testUrlChange() {
      const beforeUrl = location.href;
      const newUrl = createTestUrl();

      statusValue.textContent = "URL変更を実行中";
      statusValue.className = "";

      try {
        /*
          replaceStateは現在の履歴項目のURLだけを変更します。
          履歴の大量追加は行いません。
        */
        history.replaceState(
          { source: "debug-test" },
          "",
          newUrl
        );

        changeCount += 1;

        const afterUrl = location.href;
        const changed = beforeUrl !== afterUrl;

        countValue.textContent = String(changeCount);
        lastRunValue.textContent =
          new Date().toLocaleTimeString("ja-JP");

        urlChangedValue.textContent =
          changed ? "成功" : "変化なし";

        errorValue.textContent = "なし";

        statusValue.textContent =
          changed ? "正常に変更されました" : "変更を確認できません";

        statusValue.className =
          changed ? "success" : "error";

        updateUrlDisplay();
      } catch (error) {
        statusValue.textContent = "URL変更エラー";
        statusValue.className = "error";

        errorValue.textContent =
          error instanceof Error
            ? `${error.name}: ${error.message}`
            : String(error);

        lastRunValue.textContent =
          new Date().toLocaleTimeString("ja-JP");

        urlChangedValue.textContent = "失敗";

        updateUrlDisplay();
      }
    }

    function updateUrlDisplay() {
      currentUrlElement.textContent = location.href;
    }

    loginButton.addEventListener("click", login);

    testButton.addEventListener("click", testUrlChange);

    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        login();
      }
    });

    passwordInput.addEventListener("input", function () {
      loginError.style.display = "none";
    });

    window.addEventListener("popstate", updateUrlDisplay);

    window.addEventListener("pageshow", function () {
      if (systemStarted) {
        updateClock();
        updateUrlDisplay();
      }
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && systemStarted) {
        updateClock();
        updateUrlDisplay();
      }
    });
  </script>
</body>
</html>
