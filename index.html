<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>学習ポータル</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#loginScreen{
  min-height:100dvh;
  background:#6a768b;
  display:flex;
  justify-content:center;
  align-items:center;
}

.portal{
  width:min(900px,90%);
  display:flex;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.left{
  flex:1;
  background:#a9b0bd;
  color:#fff;
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.right{
  flex:1;
  background:#fff;
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

input{
  padding:12px;
  font-size:16px;
  margin-top:10px;
}

button{
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:999px;
  background:#7e95ff;
  color:white;
  cursor:pointer;
}

#error{
  display:none;
  color:#d33;
  margin-top:10px;
}

#clockScreen{
  display:none;
  min-height:100dvh;
  background:#000;
  color:#00ff00;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#clock{
  font-family:monospace;
  font-size:clamp(4rem,12vw,10rem);
}

#url{
  color:#00ffff;
  margin-top:20px;
  text-align:center;
  max-width:90vw;
  word-break:break-all;
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="portal">

    <div class="left">
      <h1>LEARNING</h1>
      <p>
        学習ポータルシステム<br>
        アクセスコードを入力してください
      </p>
    </div>

    <div class="right">
      <h2>📘 学習ポータル</h2>

      <input
        id="password"
        type="password"
        placeholder="アクセスコード">

      <button onclick="login()">
        学習開始
      </button>

      <div id="error">
        アクセスコードが違います
      </div>
    </div>

  </div>
</div>

<div id="clockScreen">
  <div id="clock">00:00:00</div>
  <div id="url"></div>
</div>

<script>
const PASSWORD = "0423";

function login(){
  const value =
    document.getElementById("password").value;

  if(value !== PASSWORD){
    document.getElementById("error").style.display =
      "block";
    return;
  }

  document.getElementById("loginScreen").style.display =
    "none";

  document.getElementById("clockScreen").style.display =
    "flex";

  updateClock();
  updateUrl();

  setInterval(updateClock,1000);
}

function updateClock(){
  const now = new Date();

  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  document.getElementById("clock").textContent =
    `${h}:${m}:${s}`;
}

function updateUrl(){
  document.getElementById("url").textContent =
    location.href;
}

document
.getElementById("password")
.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    login();
  }
});
</script>

</body>
</html>
