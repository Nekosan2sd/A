<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>タマヨケ v0.34</title>
<style>
:root{color-scheme:dark;background:#0b1220}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0b1220}
body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;background:#0b1220}
#message{position:fixed;z-index:10;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));padding:12px;border-radius:12px;background:#7f1d1d;color:#fff;font:14px/1.5 system-ui,sans-serif;white-space:pre-wrap;display:none;pointer-events:none}
</style>

<style>
#app-ui{position:fixed;inset:0;z-index:20;pointer-events:none;font-family:system-ui,sans-serif;color:#f8fafc}.panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));padding:24px;border:1px solid #475569;border-radius:18px;background:rgba(15,23,42,.96);box-shadow:0 20px 70px #0008;text-align:center}.hidden{display:none!important}.menu-panel h1{font-size:38px;margin:0 0 4px}.menu-panel h1 span,.subtitle{color:#60a5fa}.menu-panel h2{margin-top:0}.menu-panel button,.menu-panel input{box-sizing:border-box;width:100%;min-height:48px;margin:7px 0;border-radius:12px;border:1px solid #64748b;font-size:18px}.menu-panel button{background:#2563eb;color:white;font-weight:700}.menu-panel button.secondary{background:#334155}.menu-panel button.danger{background:#991b1b}.menu-panel input{padding:0 14px;background:#0f172a;color:white}.room-code{font-size:42px;font-weight:900;letter-spacing:6px;color:#93c5fd;margin:12px}.menu-panel ul{padding:0;list-style:none;text-align:left}.player-dot{display:inline-block;width:9px;height:9px;margin-right:9px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}.menu-note{color:#cbd5e1;margin:4px 0 14px}.menu-panel li{padding:10px 12px;margin:6px 0;background:#1e293b;border-radius:8px}.net-status{position:absolute;top:12px;right:12px;padding:8px 12px;border-radius:9px;background:#0f172acc;color:#bfdbfe;pointer-events:none}canvas.menu-open{filter:blur(3px) brightness(.45)}
</style>
</head>
<body>

<div id="app-ui" aria-live="polite">
  <section id="main-menu" class="panel menu-panel">
    <h1>タマヨケ <span>v0.34</span></h1>
    <p class="subtitle">Wi-Fiマルチプレイアップデート</p><p class="menu-note">同じWi-Fiの2〜4人で対戦</p>
    <input id="player-name" maxlength="12" placeholder="プレイヤー名" value="Player">
    <button id="solo-btn">ひとりで遊ぶ</button>
    <button id="multi-btn">Wi-Fiマルチ</button>
    <button id="help-btn" class="secondary">操作方法</button>
  </section>
  <section id="multi-menu" class="panel menu-panel hidden">
    <h2>Wi-Fiマルチ</h2>
    <button id="create-room-btn">ルームを作る</button>
    <label>6桁ルームコード</label>
    <input id="room-code" inputmode="numeric" maxlength="6" placeholder="000000">
    <button id="join-room-btn">参加する</button>
    <button data-back class="secondary">戻る</button>
  </section>
  <section id="lobby" class="panel menu-panel hidden">
    <h2>待機ルーム</h2>
    <div id="room-code-display" class="room-code">--- ---</div>
    <button id="copy-code-btn" class="secondary">コードをコピー</button>
    <p id="connection-guide">同じWi-Fiでこのゲームを開き、6桁コードを入力してください。</p>
    <ul id="player-list"></ul>
    <button id="start-match-btn" class="hidden">ゲーム開始</button>
    <button id="leave-room-btn" class="danger">退出</button>
  </section>
  <section id="help-panel" class="panel menu-panel hidden">
    <h2>操作方法</h2>
    <p>左スティック: 移動</p><p>右スティック: 照準・射撃</p><p>Rキー: リロード / Esc: メニュー</p>
    <button data-back class="secondary">戻る</button>
  </section>
  <div id="net-status" class="net-status hidden"></div>
</div>
<canvas id="game" aria-label="タマヨケ v0.34"></canvas>
<div id="message" role="alert"></div>
<noscript>JavaScriptを有効にしてください。</noscript>
<script src="/game.js" defer></script>
</body>
</html>
